apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
spec:
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http-web
  selector:
    app: frontend
