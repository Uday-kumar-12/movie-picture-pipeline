name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pipenv virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-${{ hashFiles('backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: ./backend
        run: pipenv install --dev

      - name: Run linter
        working-directory: ./backend
        run: pipenv run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pipenv virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-${{ hashFiles('backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: ./backend
        run: pipenv install --dev

      - name: Run tests
        working-directory: ./backend
        run: pipenv run test

  build-and-deploy:
    name: Build, Push & Deploy Backend
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Build application using Docker
        working-directory: ./backend
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REPO="${{ secrets.ECR_BACKEND_REPOSITORY }}"
          docker build -t "$ECR_REPO:$IMAGE_TAG" .

      - name: Push Docker image to ECR
        working-directory: ./backend
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REPO="${{ secrets.ECR_BACKEND_REPOSITORY }}"
          docker push "$ECR_REPO:$IMAGE_TAG"

      - name: Setup EKS Kubeconfig
        uses: ./.github/actions/setup-eks-kubectl
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          cluster-name: ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy application using kubectl to Kubernetes cluster
        run: |
          cd backend/k8s
          kustomize edit set image backend=${{ secrets.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
          kustomize build | kubectl apply -f -
          kubectl rollout status deployment/backend-deployment --timeout=180s
