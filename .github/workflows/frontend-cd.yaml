name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run lint
        working-directory: ./frontend
        run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm run test

  build-and-deploy:
    name: Build, Push & Deploy Frontend
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup EKS Kubeconfig
        uses: ./.github/actions/setup-eks-kubectl
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          cluster-name: ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Resolve Backend Public Endpoint
        id: resolve-endpoint
        run: |
          kubectl get svc backend-service
          BACKEND_HOST=""
          for i in {1..30}; do
            BACKEND_HOST=$(kubectl get svc backend-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -z "$BACKEND_HOST" ]; then
              BACKEND_HOST=$(kubectl get svc backend-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            fi
            if [ -n "$BACKEND_HOST" ]; then
              break
            fi
            echo "Waiting for backend LoadBalancer external endpoint... ($i/30)"
            sleep 5
          done

          if [ -z "$BACKEND_HOST" ]; then
            echo "Error: Failed to obtain an externally reachable LoadBalancer endpoint for backend-service." >&2
            exit 1
          fi

          RESOLVED_URL="http://${BACKEND_HOST}:5000"
          echo "api_url=$RESOLVED_URL" >> $GITHUB_OUTPUT
          echo "Resolved backend API URL: $RESOLVED_URL"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Build application using Docker
        working-directory: ./frontend
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REPO="${{ secrets.ECR_FRONTEND_REPOSITORY }}"
          API_URL="${{ steps.resolve-endpoint.outputs.api_url }}"

          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$API_URL" \
            -t "$ECR_REPO:$IMAGE_TAG" \
            .

      - name: Push Docker image to ECR
        working-directory: ./frontend
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REPO="${{ secrets.ECR_FRONTEND_REPOSITORY }}"
          docker push "$ECR_REPO:$IMAGE_TAG"

      - name: Deploy application using kubectl to EKS cluster
        run: |
          cd frontend/k8s
          kustomize edit set image frontend=${{ secrets.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
          kustomize build | kubectl apply -f -
          kubectl rollout status deployment/frontend-deployment --timeout=180s
